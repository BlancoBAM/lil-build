# Lilith Linux Theme Configuration
# Flame/Gothic dark aesthetic — deep black, crimson, infernal orange
# =============================================================================

[icons]
# Default icon theme
default = "Fluent-dark"

# Available themes after installation:
# - Fluent (auto light/dark)
# - Fluent-dark
# - Fluent-light

[theme]
# GTK theme for dark mode
gtk_theme = "Fluent-dark"

# Icon theme
icon_theme = "Fluent-dark"

# Cursor theme (Lilith custom cursor sets in /usr/share/icons/Lilith/)
cursor_theme = "Lilith-Default"

# Color scheme (for COSMIC)
[colors]
# Dark mode by default
scheme = "dark"

# Primary flame accent — ember red
accent = "#C0392B"

# Secondary accent — infernal orange
accent_secondary = "#FF6B35"

# Tertiary accent — dark crimson highlight
accent_tertiary = "#8B1A1A"

# Background colors — deep void black
background = "#0D0D0D"
surface = "#161616"
surface_variant = "#1F1F1F"
surface_raised = "#242424"

# Border / divider
border = "#2A1010"
border_active = "#C0392B"

# Text colors
on_background = "#F0E6E6"
on_surface = "#D4C4C4"
on_surface_muted = "#8A7070"

# Error / warning
error = "#FF4444"
warning = "#FF8C00"
success = "#4CAF50"

# COSMIC Desktop settings
[desktop.cosmic]
# Enable dark mode
dark_mode = true

# Desktop background
background = "/usr/share/backgrounds/lilith/default.jpg"

# COSMIC accent color (flame red)
accent_color = "#C0392B"

# Show desktop icons
show_desktop_icons = false

# Dock/panel settings
panel_autohide = true
dock_position = "bottom"
dock_icon_size = 48

# Window gap / tiling
window_gap = 8

# Fonts
[fonts]
# System font (Lilith custom fonts take priority if installed)
sans = "Inter"
mono = "JetBrains Mono"
display = "Toxia"

# Font sizes
font_size = 11
font_size_small = 10

# DPI scaling
dpi_scaling = 1.0

# SDDM Login Screen
[sddm]
theme = "lilith"
background = "/usr/share/sddm/themes/lilith/background.jpg"
accent_color = "#C0392B"
font = "Inter"

# Plymouth Boot Screen
[plymouth]
theme = "lilith-flame"
logo = "/usr/share/plymouth/themes/lilith-flame/logo.png"
# Background: deep black
background_color = "#0D0D0D"

# Calamares Installer
[calamares]
branding = "lilith"
# Primary color — flame red
color_primary = "#C0392B"
# Slideshow background
background_color = "#0D0D0D"
# Logo
logo = "/usr/share/calamares/branding/lilith/lilith-logo.png"

# Package Repository
[repository]
url = "https://blancobam.github.io/lilith-packages"
apt_source = "deb [arch=amd64 signed-by=/usr/share/keyrings/lilith-archive-keyring.gpg] https://blancobam.github.io/lilith-packages stable main xtra"
keyring = "/usr/share/keyrings/lilith-archive-keyring.gpg"
