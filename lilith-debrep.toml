# Lilith Linux Package Repository Specification
# =============================================================================
# Format: debrepbuild-style TOML
# Updated: 2026-05-22 — Comprehensive coverage of all lil-core.txt and
# xtra-pks.txt packages, including GitHub repo resolutions to specific
# release URLs / install methods.
# =============================================================================

[repository]
name = "Lilith Linux"
description = "Lilith Linux Overlay Package Repository — thin wrapper over Ubuntu Resolute"
architectures = ["amd64"]
signing_key = "blancobam@protonmail.com"
url = "https://blancobam.github.io/lilith-packages"

[distribution]
name = "stable"
codename = "stable"
version = "1.0.0"
components = ["main", "xtra", "desktop"]

# =============================================================================
# UPSTREAM SOURCES
# =============================================================================
[upstream_sources]

[upstream_sources.ubuntu_resolute]
type = "apt-mirror"
url = "http://archive.ubuntu.com/ubuntu/"
distribution = "resolute"
components = ["main", "universe", "multiverse", "restricted"]
sync_interval = "daily"
priority = 100

[upstream_sources.hepp3n_cosmic]
# COSMIC Desktop PPA (Pop!OS COSMIC Epoch)
type = "ppa"
url = "ppa:hepp3n/cosmic-epoch"
sync_interval = "weekly"
priority = 95

# =============================================================================
# CORE PACKAGES — Main Component
# Installed by default on every Lilith Linux system.
# Sources resolved from lil-core.txt.
# =============================================================================

# ── DEB REDIRECTS (direct .deb downloads from GitHub Releases) ───────────────

[lilith_packages.core.offerings]
source = "redirect"
upstream = "https://github.com/BlancoBAM/Offerings/releases/download/v1.1.0/offerings_1.0.2-beta-1_amd64.deb"
version = "1.2.0"
auto_update = true
github_repo = "BlancoBAM/Offerings"
deb_pattern = "offerings_*_amd64.deb"
description = "Unified package manager GUI for Lilith Linux"
depends = ["libfontconfig1", "libxcb1", "libxkbcommon0", "libssl3"]
install_also = "curl -fsSL https://raw.githubusercontent.com/BlancoBAM/Offerings/main/install.sh | bash"

[lilith_packages.core.tweakers]
source = "redirect"
upstream = "https://github.com/BlancoBAM/Tweakers/releases/download/v1.0.1/tweakers-v1.0.1-amd64.deb"
version = "1.0.2"
auto_update = true
github_repo = "BlancoBAM/Tweakers"
deb_pattern = "tweakers-*-amd64.deb"
description = "System optimization and tweaks GUI"
depends = ["libfontconfig1", "libxcb1", "libgtk-3-0"]

[lilith_packages.core.lilim]
source = "redirect"
upstream = "https://github.com/BlancoBAM/Lilim/releases/download/build-31/lilim_0.1.0_amd64.deb"
version = "build-31"
auto_update = true
github_repo = "BlancoBAM/Lilim"
deb_pattern = "lilim_*_amd64.deb"
description = "AI Assistant with persistent memory (Lilith AI)"
depends = ["python3", "python3-pip", "nodejs", "npm"]

[lilith_packages.core.stake]
source = "redirect"
upstream = "https://github.com/BlancoBAM/Stake/releases/download/v0.2.3/stake-v0.2.3-amd64.deb"
version = "0.2.4"
auto_update = true
github_repo = "BlancoBAM/Stake"
deb_pattern = "stake-*-amd64.deb"
description = "Lilith Stake CLI package manager tool"
depends = ["libssl3"]

[lilith_packages.core.ouija-pad]
source = "redirect"
upstream = "https://github.com/BlancoBAM/Ouija-Pad/releases/download/v1.1.0/ouija-pad_1.1.0_amd64.deb"
version = "1.1.0"
auto_update = true
github_repo = "BlancoBAM/Ouija-Pad"
deb_pattern = "ouija-pad_*_amd64.deb"
description = "Lilith default text editor GUI"
depends = ["libwebkit2gtk-4.1-0"]

[lilith_packages.core.lsd]
source = "redirect"
upstream = "https://github.com/lsd-rs/lsd/releases/download/v1.2.0/lsd_1.2.0_amd64.deb"
version = "1.2.0"
auto_update = true
github_repo = "lsd-rs/lsd"
deb_pattern = "lsd_*_amd64.deb"
description = "Modern ls replacement with icons and colors"

[lilith_packages.core.zoxide]
source = "redirect"
upstream = "https://github.com/ajeetdsouza/zoxide/releases/download/v0.9.9/zoxide_0.9.9-1_amd64.deb"
version = "0.9.9"
auto_update = true
github_repo = "ajeetdsouza/zoxide"
deb_pattern = "zoxide_*_amd64.deb"
description = "Smart cd — learns your most frequent directories"

[lilith_packages.core.bat]
source = "redirect"
upstream = "https://github.com/sharkdp/bat/releases/download/v0.26.1/bat_0.26.1_amd64.deb"
version = "0.26.1"
auto_update = true
github_repo = "sharkdp/bat"
deb_pattern = "bat_*_amd64.deb"
description = "cat replacement with syntax highlighting and git integration"

[lilith_packages.core.topgrade]
source = "redirect"
upstream = "https://github.com/topgrade-rs/topgrade/releases/download/v17.5.0/topgrade_17.5.0_amd64.deb"
version = "17.5.1"
auto_update = true
github_repo = "topgrade-rs/topgrade"
deb_pattern = "topgrade_*_amd64.deb"
description = "Upgrade everything — apt, cargo, npm, flatpak, etc."

# ── WRAPPER PACKAGES (binary/AppImage/installer downloads) ───────────────────

[lilith_packages.core.s8n-system]
source = "wrapper"
upstream = "https://github.com/BlancoBAM/S8n-System/releases/download/v0.1.3/s8n-linux-amd64"
version = "0.1.3"
description = "Lilith System Package Manager CLI wrapper (s8n)"
install_method = "binary"
install_dest = "/usr/local/bin/s8n"

[lilith_packages.core.hellfire]
source = "wrapper"
upstream = "https://github.com/CYFARE/HellFire/releases/download/v152.0a1_FP2/hellfire-152.0a1.en-US.linux-x86_64.tar.xz"
installer = "https://github.com/CYFARE/HellFire/releases/download/v152.0a1_FP2/linux_installer.py"
version = "152.0a1"
description = "HellFire Browser — custom-compiled privacy-focused Firefox for Lilith Linux"
install_method = "tarball"
install_dest = "/opt/hellfire"
binary_name = "firefox"
symlink = "/usr/local/bin/hellfire"
desktop = true
homepage = "https://github.com/CYFARE/HellFire"

[lilith_packages.core.browseros]
source = "wrapper"
upstream = "https://github.com/BlancoBAM/Lilith-Linux/raw/main/BrowserOS_v0.42.0.1_x64.AppImage"
version = "0.42.0.1"
description = "Lilith Default Web Browser OS AppImage"
install_method = "appimage"
install_dest = "/opt/browseros"
depends = ["libfuse2t64"]

[lilith_packages.core.hyper-terminal]
source = "wrapper"
upstream = "https://github.com/BlancoBAM/Lilith-Linux/raw/main/Hyper-3.4.1.AppImage"
version = "3.4.1"
description = "Hyper terminal emulator for Lilith Linux"
install_method = "appimage"
install_dest = "/opt/hyper"
config_files = ["~/hyper_setup_backup.js", "~/hyper_backup/"]
depends = ["libfuse2t64"]

[lilith_packages.core.vicinae]
source = "wrapper"
upstream = "https://github.com/vicinaehq/vicinae/releases/download/v0.21.0/Vicinae-x86_64.AppImage"
version = "0.21.0"
description = "Vicinae Visual Workspace AppImage"
install_method = "appimage"
install_dest = "/opt/vicinae"
depends = ["libfuse2t64"]

[lilith_packages.core.lilith-tts]
source = "wrapper"
upstream = "https://github.com/BlancoBAM/Lilith-TTS"
version = "1.0.0"
description = "Lilith Linux Text-to-Speech Engine (Rust daemon)"
install_method = "cargo-build"
binary_name = "lilith-tts-daemon"
install_dest = "/usr/local/bin/lilith-tts"

[lilith_packages.core.nushell]
source = "wrapper"
upstream = "https://github.com/nushell/nushell/releases/latest"
resolved_url = "https://github.com/nushell/nushell/releases/download/0.103.0/nu-0.103.0-x86_64-unknown-linux-musl.tar.gz"
version = "0.103.0"
description = "Nu shell — structured data shell written in Rust"
install_method = "tarball-binary"
binary_name = "nu"
install_dest = "/usr/local/bin/nu"
apt_alternative = "nushell"

[lilith_packages.core.fd]
source = "wrapper"
upstream = "https://github.com/sharkdp/fd"
resolved_url = "https://github.com/sharkdp/fd/releases/download/v10.2.0/fd-v10.2.0-x86_64-unknown-linux-musl.tar.gz"
version = "10.4.2"
description = "fd — fast and user-friendly find alternative"
install_method = "tarball-binary"
binary_name = "fd"
install_dest = "/usr/local/bin/fd"
note = "Direct binary extraction to avoid conflict with fd-find package required by pop-launcher"

[lilith_packages.core.skim]
source = "wrapper"
upstream = "https://github.com/skim-rs/skim"
resolved_url = "https://github.com/skim-rs/skim/releases/latest"
version = "0.17.5"
description = "skim (sk) — fuzzy finder written in Rust"
install_method = "binary-or-wrapper"
binary_name = "sk"
install_dest = "/usr/local/bin/sk"
fallback = "fzf"
note = "No prebuilt x86_64 Linux binary; sk wrapper backed by fzf installed instead"
apt_alternative = "fzf"

[lilith_packages.core.procs]
source = "apt"
