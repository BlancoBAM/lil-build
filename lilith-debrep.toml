# =============================================================================
# SYSTEM / BUILD DEPENDENCIES
# Required to build and run the packages above.
# =============================================================================
[dependencies]
apt = [
    "build-essential",
    "cargo",
    "rustc",
    "libssl-dev",
    "pkg-config",
    "cmake",
    "git",
    "curl",
    "wget",
    "nodejs",
    "npm",
    "python3",
    "python3-pip",
    "flatpak",
    "gnome-software-plugin-flatpak",
    "libfuse2t64",
    "libwayland-dev",
    "libseat-dev",
    "libxkbcommon-dev",
    "libinput-dev",
    "libgtk-3-dev",
    "libfontconfig1-dev",
    "libxcb1-dev",
    "software-properties-common",
    "dpkg-dev",
    "gzip",
    "apt-transport-https",
    "ca-certificates",
    "gnupg",
    "lsb-release"
]

# =============================================================================
# BUILD CONFIGURATION
# =============================================================================
[build]
jobs = 4
build_dir = "/tmp/lilith-build"
output_dir = "/home/aegon/lil-build/Lilith-Repo"
sign = false
regenerate_indexes = true
update_manifest = true
